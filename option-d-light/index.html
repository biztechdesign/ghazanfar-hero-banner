<title>Ghazanfar Bank — Hero background, Option D (light ground)</title>
<!--
  OPTION D — KHATAM LATTICE ON A LIGHT GROUND
  The same lattice as Option A, but the hero sits on white / off-white instead of
  the khaki gradient, and the lattice ink is one themed colour: navy blue, gold or
  green. Switch with the pills bottom-left, or set data-pattern="blue|gold|green"
  on <html> to lock one in. The app shot is 25% larger than in Option A.
  Standalone file — inline SVG + CSS, no server and no internet needed.
-->
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:#f7f5ef}

  /* ---------------------------------------------------------------
     PATTERN COLOUR — three inks over the same ground. The ground is
     pure white for its first 70%; the theme colour only appears as a
     tint in the last 30%. Set data-pattern on <html> to pick one.
     --------------------------------------------------------------- */
  :root,
  :root[data-pattern="blue"]{
    --ground:linear-gradient(#ffffff 0%, #ffffff 70%, #eef3fa 100%);
    --line-star:rgba(0,68,148,.15);
    --line-cross:rgba(0,68,148,.10);
    --node:rgba(0,68,148,.025);
    --mark-fill:rgba(0,68,148,.07);
    --mark-ink:rgba(0,68,148,.22);
    --accent:#004494;
    --shadow:rgba(18,34,62,.20);
  }
  :root[data-pattern="gold"]{
    --ground:linear-gradient(#ffffff 0%, #ffffff 70%, #faf4e7 100%);
    --line-star:rgba(166,120,14,.20);
    --line-cross:rgba(166,120,14,.13);
    --node:rgba(243,183,26,.06);
    --mark-fill:rgba(166,120,14,.08);
    --mark-ink:rgba(140,100,10,.24);
    --accent:#004494;
    --shadow:rgba(74,56,16,.20);
  }
  :root[data-pattern="green"]{
    --ground:linear-gradient(#ffffff 0%, #ffffff 70%, #edf6f2 100%);
    --line-star:rgba(15,107,79,.16);
    --line-cross:rgba(15,107,79,.11);
    --node:rgba(15,107,79,.03);
    --mark-fill:rgba(15,107,79,.07);
    --mark-ink:rgba(15,107,79,.23);
    /* the CTA stays brand navy in every theme; swap to #0f6b4f if you want the
       button to follow the pattern colour too */
    --accent:#004494;
    --shadow:rgba(16,54,42,.20);
  }

  /* ---------------------------------------------------------------
     The hero. In the real site this is the existing
     <section class="section-spacing relative h-screen w-full overflow-hidden">
     --------------------------------------------------------------- */
  .hero{position:relative;height:100vh;width:100%;overflow:hidden;isolation:isolate}

  /* layer 0 — white / off-white ground, tinted a touch toward the pattern colour */
  .hero__grad{
    position:absolute;inset:0;z-index:0;
    background:var(--ground);
  }

  /* layer 1 — the motif, spanning the whole hero section. */
  .hero__motif{
    position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;
  }
  .motif{position:absolute;inset:0;will-change:transform}
  .motif svg{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* layer 1b — a soft white clearing under the copy. The lattice is background,
     so it steps aside where the headline sits instead of fighting it. */
  .hero__scrim{
    position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(58% 62% at 22% 50%,
      rgba(255,255,255,.94) 0%,
      rgba(255,255,255,.80) 42%,
      rgba(255,255,255,.38) 66%,
      rgba(255,255,255,0)   84%);
  }

  /* layer 2 — the copy */
  .hero__content{position:absolute;inset:0;z-index:2;display:flex;align-items:center}
  .wrap{margin:0 auto;width:100%;max-width:1280px;padding:0 clamp(24px,5vw,32px)}
  h1{font-size:clamp(34px,4.6vw,60px);line-height:1.07;letter-spacing:-.025em;
     margin:0 0 20px;color:#0e1726;font-weight:700;max-width:13ch}
  .sub{font-size:18px;line-height:1.5;color:#42505f;margin:0 0 32px;max-width:34ch}
  .btns{display:flex;gap:12px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 23px;border-radius:7px;
       font-size:15px;font-weight:600;text-decoration:none;border:1px solid transparent}
  .btn--p{background:var(--accent);color:#fff}
  /* a white button on a white ground needs an edge to exist */
  .btn--s{background:#fff;color:var(--accent);border-color:rgba(14,23,38,.14);
       box-shadow:0 1px 2px rgba(14,23,38,.05)}

  /* ---------------- animation ---------------- */
/* One line grows through the whole net. Each star opens at its left tip and its
   two halves travel round to meet at the right tip - which is where the next
   shape picks the line up, so the growth chains shape to shape, left to right.
   Nothing fades: the stroke is the reveal. */
.ln{stroke-dasharray:1;stroke-dashoffset:1;will-change:stroke-dashoffset}
.ln-star{stroke:var(--line-star);animation:draw .62s cubic-bezier(.3,.65,.4,1) forwards}
.ln-cross{stroke:var(--line-cross);fill:var(--node);fill-opacity:0;
  animation:draw .42s cubic-bezier(.3,.65,.4,1) forwards,
  fillIn .42s linear forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fillIn{to{fill-opacity:1}}
  @keyframes fadeIn{to{opacity:1}}
  /* The mark is three disconnected subpaths. Drawn as one dashed path the pen
     teleports between them, which is what read as stuttery. Each subpath is drawn
     on its own instead, in sequence, at one constant speed (linear = no crawling
     tail, which is what actually makes a draw look smooth). */
  .mark-ink{stroke:var(--mark-ink);will-change:stroke-dashoffset}
  @keyframes drawLen{to{stroke-dashoffset:0}}
  .mark-fill{fill:var(--mark-fill);opacity:0;animation:fadeIn 1.4s cubic-bezier(.22,.61,.36,1) 1.5s forwards}
  /* translates by exactly one grid cell, so the loop is seamless whatever
     size the lattice is set to. JS keeps --cell in sync with CELL. */
  .drift{animation:drift 120s linear infinite}
  @keyframes drift{to{transform:translate(
    calc(-1 * var(--cell,104px)), calc(-1 * var(--cell,104px)))}}
  .bloom{transform-box:view-box;opacity:0;animation:bloom 1.5s cubic-bezier(.16,.9,.3,1) forwards}
  @keyframes bloom{0%{opacity:0;transform:scale(.62) rotate(-14deg)}100%{opacity:1;transform:scale(1) rotate(0deg)}}
  .breathe{transform-box:view-box;animation:breathe 16s ease-in-out infinite alternate}
  @keyframes breathe{from{transform:scale(1)}to{transform:scale(1.03)}}

  /* on phones the motif would sit behind the copy — move it below and soften it */
  @media (max-width:768px){
    .hero__motif{opacity:.7}
    .hero__scrim{background:radial-gradient(96% 60% at 42% 46%,
      rgba(255,255,255,.94) 0%, rgba(255,255,255,.78) 50%, rgba(255,255,255,0) 88%)}
  }
  @media (prefers-reduced-motion:reduce){
    .ln,.bloom,.mark-ink,.mark-fill{animation:none!important;opacity:1!important;
      fill-opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
    .drift,.breathe,.shot__inner{animation:none!important;transform:none!important}
    .phone{animation:none!important;opacity:1!important;transform:none!important}
    .shot__inner{transform:none!important}
    .sheen{animation:none!important;opacity:0!important}
  }

  /* ---------------- the app shot, right side ----------------
     One PNG, sliced with background-position so the three phones can move
     independently: the centre one rises, the outer two fan out from behind it. */
  /* the shot is pinned to the right edge of the same 1280 container as the copy */
  .shot-layer{position:absolute;inset:0;z-index:2;pointer-events:none;display:flex;align-items:center}
  .shot-wrap{margin:0 auto;width:100%;max-width:1280px;padding:0 clamp(24px,5vw,32px);
    display:flex;justify-content:flex-end}
  .shot{
    position:relative;
    width:383px;height:301px;

  .shot__inner{position:absolute;inset:0;animation:float 9s ease-in-out 2.8s infinite alternate}
  .phone{
    position:absolute;top:0;height:301px;opacity:0;
    background-image:var(--shot);background-repeat:no-repeat;background-size:383px 301px;
    filter:drop-shadow(0 18px 30px var(--shadow));
  }
  .p1{left:0;width:119px;background-position:0 0;z-index:1;transform-origin:100% 85%;
      animation:fanL .95s cubic-bezier(.16,.9,.3,1) 1.66s forwards}
  .p2{left:119px;width:142px;background-position:-119px 0;z-index:3;
      animation:riseC .95s cubic-bezier(.16,.9,.3,1) 1.5s forwards}
  .p3{left:261px;width:122px;background-position:-261px 0;z-index:1;transform-origin:0 85%;
      animation:fanR .95s cubic-bezier(.16,.9,.3,1) 1.8s forwards}

  @keyframes riseC{from{opacity:0;transform:translateY(40px) scale(.93)}to{opacity:1;transform:none}}
  @keyframes fanL{from{opacity:0;transform:translate(48px,20px) rotate(7deg) scale(.94)}to{opacity:1;transform:none}}
  @keyframes fanR{from{opacity:0;transform:translate(-48px,20px) rotate(-7deg) scale(.94)}to{opacity:1;transform:none}}
  @keyframes float{from{transform:translateY(0)}to{transform:translateY(-9px)}}

  /* a single light sweep once they have landed, clipped to the phone silhouettes */
  .sheen{
    position:absolute;inset:0;z-index:4;opacity:0;
    -webkit-mask-image:var(--shot);mask-image:var(--shot);
    -webkit-mask-size:383px 301px;mask-size:383px 301px;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    background:linear-gradient(100deg,transparent 38%,rgba(255,255,255,.40) 50%,transparent 62%);
    background-size:260% 100%;
    animation:sheen 1.8s cubic-bezier(.4,0,.3,1) 3.4s forwards;
  }
  @keyframes sheen{0%{opacity:0;background-position:140% 0}12%{opacity:1}
                   100%{opacity:0;background-position:-60% 0}}

  /* step it back down as the container narrows, so it never crowds the copy */
  @media (max-width:1400px){.shot{transform:scale(1.35)}}
  @media (max-width:1180px){.shot{transform:scale(1.25)}}
  @media (max-width:1020px){.shot{transform:scale(1.05)}}
  @media (max-width:860px){.shot-layer{display:none}}

  /* preview chrome only — delete when porting */
  .replay{position:fixed;right:20px;bottom:20px;z-index:9;cursor:pointer;background:#fff;color:#111;
    border:0;border-radius:99px;padding:11px 18px;font:600 11px/1 ui-monospace,monospace;
    letter-spacing:.1em;text-transform:uppercase;box-shadow:0 6px 20px rgba(0,0,0,.2)}
  .replay:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .swatches{position:fixed;left:20px;bottom:20px;z-index:9;display:flex;gap:8px;
    background:#fff;border-radius:99px;padding:6px;box-shadow:0 6px 20px rgba(14,23,38,.14)}
  .sw{width:28px;height:28px;border-radius:99px;border:2px solid transparent;cursor:pointer;padding:0}
  .sw[aria-pressed="true"]{border-color:#0e1726}
  .sw:focus-visible{outline:2px solid #0e1726;outline-offset:2px}
  .sw--blue{background:#004494}
  .sw--gold{background:#e0a516}
  .sw--green{background:#0f6b4f}
  .sizer{position:fixed;left:20px;bottom:62px;z-index:9;display:flex;align-items:center;gap:10px;
    background:#fff;border-radius:99px;padding:8px 16px;box-shadow:0 6px 20px rgba(14,23,38,.14);
    font:600 10px/1 ui-monospace,monospace;letter-spacing:.09em;text-transform:uppercase;color:#5a6675}
  .sizer input{width:132px;accent-color:var(--accent);cursor:pointer}
  .sizer output{color:#0e1726;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<section class="hero">
  <div class="hero__grad"></div>
  <div class="hero__motif"><div class="motif" id="motif"></div></div>
  <div class="hero__scrim"></div>
  <div class="shot-layer"><div class="shot-wrap">
  <div class="shot">
    <div class="shot__inner">
      <div class="phone p1"></div>
      <div class="phone p2"></div>
      <div class="phone p3"></div>
      <div class="sheen"></div>
    </div>
  </div>
  </div></div>
  <div class="hero__content"><div class="wrap">
    <h1>Shariah-Compliant Digital Banking at Your Fingertips</h1>
    <p class="sub">Secure, transparent, and Shariah banking solutions &mdash; accessible from anywhere in Afghanistan.</p>
    <div class="btns">
      <a class="btn btn--p" href="#">Download App &rarr;</a>
      <a class="btn btn--s" href="#">Online Banking &rarr;</a>
    </div>
  </div></div>
</section>

<div class="sizer">
  <label for="cell">Pattern size</label>
  <input id="cell" type="range" min="56" max="200" step="4" value="104">
  <output id="cellOut">104px</output>
</div>
<div class="swatches" role="group" aria-label="Pattern colour">
  <button class="sw sw--blue"  data-c="blue"  aria-label="Blue pattern"  aria-pressed="true"></button>
  <button class="sw sw--gold"  data-c="gold"  aria-label="Gold pattern"  aria-pressed="false"></button>
  <button class="sw sw--green" data-c="green" aria-label="Green pattern" aria-pressed="false"></button>
</div>
<button class="replay" id="replay">Replay animation</button>

<script>
/* =====================================================================
   VARIANT: "lattice" | "mark" | "rosette"
   ===================================================================== */
var VARIANT = "lattice";

/* The gold "G" from the bank's own header logo SVG. */
var MARK = "M16.59,89.04c.31.06.46-.03.71-.19.92-.6,2.54-2.64,3.5-3.53,10.54-9.69,24.89-19.43,39.16-22.11,9.04-1.69,23.53-2.94,28.96,6.2,4.92,8.28,2.79,16.15-4.79,21.6-.32.23-2.83,1.63-2.67,1.84,8.64,3.4,10.58,11.49,8.38,19.94-3.86,14.79-26.16,35.85-42.18,26.65-4.3-2.47-6.95-6.44-9.08-10.81-6.31,7.69-16.18,16-26.86,12.2-3.84-1.36-7.04-4.32-9.02-7.85-5.96-10.61-1.19-26.07,6-35C.53,89.14.12,76.81,2.19,65.5,7.55,36.3,35.96,4.93,65.93.45c23.67-3.54,39.04,14.08,26.88,36.14-5.45,9.9-19.02,23.69-31.48,19.83-4.66-1.44-7.75-4.97-8.16-9.92-1.03-12.3,15.44-25.69,23.57-33.23.83-1,2.65.06,2.09,1.07-4.78,4.99-9.49,10.32-13.12,16.23-2.84,4.63-7.03,13.06-3.21,18.05,4.86,6.35,13.25-2.3,16.55-6.32,5.72-6.98,10.84-19.35,4.13-27.23-4.34-5.09-10.43-4.56-16.32-2.86-20.45,5.9-39.97,33.26-46.99,52.45-2.81,7.67-5.02,16.2-3.26,24.37ZM63.62,98.06c-.12-.19-.06-.78,0-1.03.27-1.06,5.56-4.75,6.79-5.87,4.69-4.29,12.13-13.61,7.02-19.89s-19.59-1.5-25.75.75c-9.06,3.3-17.55,8.27-24.95,14.42-1.03.86-7.4,6.45-7.51,7.17,5.97,7.15,16.61.81,22.53-3.39,5.08-3.6,9.27-8.16,14.45-11.66,5.48-3.7,11.89-6.86,18.4-8.18.96,2.15-1.92,2.64-3.38,3.52-8.42,5.1-10.62,11.96-14.44,20.32-4.91,10.73-9.92,21.51-16,31.61,8.13,16,22.7,2.84,29.58-6.57,3.6-4.92,8.41-13.1,6.16-19.35s-8.97.07-12.91-1.85ZM41.29,99.09c-.18-.19-4.03,2.33-4.54,2.59-7.17,3.55-17.21,4.77-23.92-.35-.24-.09-.38.03-.57.16-.52.36-2.34,3.14-2.78,3.85-4.41,7.14-6.63,17.77.39,24.09,7.33,6.61,13.7.27,18.13-5.76,5.46-7.43,9.87-16.03,13.29-24.58Z";

var NS = "http://www.w3.org/2000/svg";
var CELL = 104;           /* grid cell — the drift loop translates by exactly this.
                             Bigger = fewer, larger stars; smaller = a denser net. */
var UID = 0;

function el(t, a){ var n = document.createElementNS(NS, t); a = a || {}; for (var k in a) n.setAttribute(k, a[k]); return n; }

/* Round every corner of a polygon: cut r off each side, arc through the vertex. */
function roundPoly(pts, r){
  var d = "", n = pts.length;
  for (var i = 0; i < n; i++){
    var p = pts[(i - 1 + n) % n], v = pts[i], q = pts[(i + 1) % n];
    var ax = v[0] - p[0], ay = v[1] - p[1], bx = q[0] - v[0], by = q[1] - v[1];
    var la = Math.hypot(ax, ay), lb = Math.hypot(bx, by);
    var ra = Math.min(r, la / 2), rb = Math.min(r, lb / 2);
    var sx = v[0] - ax / la * ra, sy = v[1] - ay / la * ra;
    var ex = v[0] + bx / lb * rb, ey = v[1] + by / lb * rb;
    d += (i === 0 ? "M" : "L") + sx.toFixed(2) + "," + sy.toFixed(2);
    d += "Q" + v[0].toFixed(2) + "," + v[1].toFixed(2) + " " + ex.toFixed(2) + "," + ey.toFixed(2);
  }
  return d + "Z";
}

/* Eight-point star — tips on the axes and the diagonals. */
/* An open rounded polyline - the shape halves are not closed loops. */
function roundPolyline(pts, r){
  var d = "M" + pts[0][0].toFixed(2) + "," + pts[0][1].toFixed(2);
  for (var i = 1; i < pts.length - 1; i++){
    var p = pts[i-1], v = pts[i], q = pts[i+1];
    var ax = v[0]-p[0], ay = v[1]-p[1], bx = q[0]-v[0], by = q[1]-v[1];
    var la = Math.hypot(ax,ay), lb = Math.hypot(bx,by);
    var ra = Math.min(r,la/2), rb = Math.min(r,lb/2);
    d += "L" + (v[0]-ax/la*ra).toFixed(2) + "," + (v[1]-ay/la*ra).toFixed(2);
    d += "Q" + v[0].toFixed(2) + "," + v[1].toFixed(2) + " "
       + (v[0]+bx/lb*rb).toFixed(2) + "," + (v[1]+by/lb*rb).toFixed(2);
  }
  var e = pts[pts.length-1];
  return d + "L" + e[0].toFixed(2) + "," + e[1].toFixed(2);
}

/* The star's 16 vertices: outer tip, inner notch, outer tip ... */
function starPoints(cx, cy, R){
  var pts = [], ri = R * 0.7654;
  for (var k = 0; k < 8; k++){
    var ao = (45 * k) * Math.PI / 180, ai = (45 * k + 22.5) * Math.PI / 180;
    pts.push([cx + R * Math.cos(ao), cy + R * Math.sin(ao)]);
    pts.push([cx + ri * Math.cos(ai), cy + ri * Math.sin(ai)]);
  }
  return pts;
}

/* Split the star into two halves that both START at the left tip (index 8) and
   both END at the right tip (index 0). Drawn together, the outline opens at the
   left and closes at the right - and the right tip is exactly where the next
   shape's line begins, so the growth chains across the net. */
function starHalves(cx, cy, R){
  var p = starPoints(cx, cy, R), r = R * 0.075;
  var lower = p.slice(8).concat([p[0]]);              /* 8,9..15,0 */
  var upper = [];
  for (var i = 8; i >= 0; i--) upper.push(p[i]);      /* 8,7..1,0 */
  return [roundPolyline(lower, r), roundPolyline(upper, r)];
}

/* The cross, wound so it also starts at its left point. */

/* The cross filling each gap, its four points meeting the surrounding stars. */
function cross(cx, cy, L, w){
  var p = [[0,-L],[w,-w],[L,0],[w,w],[0,L],[-w,w],[-L,0],[-w,-w]]
    .map(function(q){ return [cx + q[0], cy + q[1]]; });
  return roundPoly(p, w * 0.5);
}

/* A soft radial hole in the lattice, so whatever sits on top gets quiet ground. */
function clearing(svg, W, H, cx, cy, r){
  var id = "gbClear" + (++UID);
  var defs = el("defs");
  var grad = el("radialGradient", {id: id + "g", cx: cx, cy: cy, r: r, gradientUnits: "userSpaceOnUse"});
  grad.appendChild(el("stop", {offset: "0", "stop-color": "#000"}));
  grad.appendChild(el("stop", {offset: ".52", "stop-color": "#000"}));
  grad.appendChild(el("stop", {offset: "1", "stop-color": "#fff"}));
  defs.appendChild(grad);
  var mask = el("mask", {id: id, maskUnits: "userSpaceOnUse", x: 0, y: 0, width: W, height: H});
  mask.appendChild(el("rect", {x: 0, y: 0, width: W, height: H, fill: "#fff"}));
  mask.appendChild(el("circle", {cx: cx, cy: cy, r: r, fill: "url(#" + id + "g)"}));
  defs.appendChild(mask);
  svg.appendChild(defs);
  return id;
}

function buildLattice(svg, W, H, maskId, ox, oy){
  var S = CELL, R = S * 0.5;
  var drift = el("g", {"class": "drift"});
  var cols = Math.ceil(W / S) + 3, rows = Math.ceil(H / S) + 3;

  /* One column hands the line to the next: a star opens, its halves meet at the
     right tip, the cross beyond it picks up, then the next column starts. */
  var P = 0.34, DSTAR = 0.62;   /* slow, deliberate growth - about 7s end to end */

  for (var c = -1; c < cols; c++){
    var tStar = 0.05 + (c + 1) * P;
    var tCross = tStar + DSTAR * 0.72;

    for (var r = -1; r < rows; r++){
      var x = c * S, y = r * S;

      var halves = starHalves(x, y, R);
      for (var h = 0; h < 2; h++){
        var ln = el("path", {d: halves[h], fill: "none", stroke: "rgba(255,255,255,.34)",
          "stroke-width": 1.1, "stroke-linejoin": "round", "stroke-linecap": "round",
          pathLength: 1, "class": "ln ln-star"});
        ln.style.animationDelay = tStar.toFixed(3) + "s";
        drift.appendChild(ln);
      }

      var cr = el("path", {d: cross(x + S / 2, y + S / 2, S * 0.23, S * 0.07),
        fill: "rgba(243,183,26,.04)", stroke: "rgba(255,255,255,.26)", "stroke-width": 1.0,
        "stroke-linejoin": "round", "stroke-linecap": "round",
        pathLength: 1, "class": "ln ln-cross"});
      cr.style.animationDelay = tCross.toFixed(3) + "s";
      drift.appendChild(cr);
    }
  }

  if (maskId){
    var h2 = el("g", {mask: "url(#" + maskId + ")"});
    h2.appendChild(drift);
    svg.appendChild(h2);
  } else svg.appendChild(drift);
}

/* The mark is a compound path of three separate strokes. Split them so each is
   drawn continuously rather than the pen jumping between disconnected regions. */
var MARK_PARTS = MARK.match(/M[^M]*/g);

/* The "G", sized to leave clear air above and below it.
   The svg must already be in the document - getTotalLength() needs a layout. */
function addMark(svg, H, cx, cy){
  var g = el("g", {transform: "translate(" + cx + " " + cy + ") scale(" + (H / 235) + ") translate(-48 -71)"});

  var fill = el("path", {d: MARK, fill: "rgba(255,255,255,.40)", "class": "mark-fill"});
  g.appendChild(fill);

  var inks = MARK_PARTS.map(function(d){
    var p = el("path", {d: d, fill: "none", stroke: "rgba(0,68,148,.55)", "stroke-width": .9,
      "stroke-linecap": "round", "stroke-linejoin": "round", "class": "mark-ink"});
    g.appendChild(p);
    return p;
  });
  svg.appendChild(g);

  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;

  /* One constant pen speed across all three: each subpath's duration is
     proportional to its real length, and they run back to back. */
  var lens = inks.map(function(p){ return p.getTotalLength(); });
  var total = lens.reduce(function(a, b){ return a + b; }, 0);
  var SPAN = 1.9, t = 1.0;
  inks.forEach(function(p, i){
    var dur = SPAN * lens[i] / total;
    p.style.strokeDasharray = lens[i];
    p.style.strokeDashoffset = lens[i];
    p.style.animation = "drawLen " + dur.toFixed(3) + "s linear " + t.toFixed(3) + "s forwards";
    t += dur;
  });
}

/* One lattice star blown up, blooming petal by petal. */
function addRosette(svg, H, cx, cy){
  var R = H * 0.46;
  var petal = "M0,0 C -0.19,-0.26 -0.20,-0.63 0,-1 C 0.20,-0.63 0.19,-0.26 0,0 Z";
  var host = el("g", {"class": "breathe"});
  host.style.transformOrigin = cx + "px " + cy + "px";

  for (var i = 0; i < 8; i++){
    var arm = el("g", {transform: "rotate(" + (i * 45) + " " + cx + " " + cy + ")"});
    var anim = el("g", {"class": "bloom"});
    anim.style.transformOrigin = cx + "px " + cy + "px";
    anim.style.animationDelay = (0.9 + i * 0.09) + "s";
    var scaled = el("g", {transform: "translate(" + cx + " " + cy + ") scale(" + R + ")"});
    scaled.appendChild(el("path", {d: petal,
      fill: (i % 2) ? "rgba(255,255,255,.27)" : "rgba(255,255,255,.17)"}));
    anim.appendChild(scaled); arm.appendChild(anim); host.appendChild(arm);
  }
  var core = el("circle", {cx: cx, cy: cy, r: H * 0.09, fill: "rgba(243,183,26,.14)", "class": "bloom"});
  core.style.transformOrigin = cx + "px " + cy + "px";
  core.style.animationDelay = "1.7s";
  host.appendChild(core);
  svg.appendChild(host);
}

var host = document.getElementById("motif");

function build(){
  var W = host.clientWidth, H = host.clientHeight;
  if (!W || !H) return;
  host.replaceChildren();

  /* keep the drift keyframe's travel equal to one cell, so the loop stays seamless */
  document.documentElement.style.setProperty("--cell", CELL + "px");

  var svg = el("svg", {viewBox: "0 0 " + W + " " + H, preserveAspectRatio: "none", "aria-hidden": "true"});
  var cx = W * 0.72, cy = H * 0.5, maskId = null;

  if (VARIANT === "mark")    maskId = clearing(svg, W, H, cx, cy, H * 0.62);
  if (VARIANT === "rosette") maskId = clearing(svg, W, H, cx, cy, H * 0.60);

  buildLattice(svg, W, H, maskId, cx, cy);
  host.appendChild(svg);                       /* in the DOM first, so lengths measure */
  if (VARIANT === "mark")    addMark(svg, H, cx, cy);
  if (VARIANT === "rosette") addRosette(svg, H, cx, cy);
}

build();

/* rebuild on resize so we only ever draw the tiles that are on screen */
var rt;
addEventListener("resize", function(){ clearTimeout(rt); rt = setTimeout(build, 200); });

/* pointer parallax — skipped on touch and under reduced-motion */
if (!matchMedia("(prefers-reduced-motion:reduce)").matches && matchMedia("(hover:hover)").matches){
  var mx = 0, my = 0, tx = 0, ty = 0;
  addEventListener("pointermove", function(e){
    mx = e.clientX / innerWidth - .5;
    my = e.clientY / innerHeight - .5;
  }, {passive: true});
  (function loop(){
    tx += (mx - tx) * .06; ty += (my - ty) * .06;
    host.style.transform = "translate3d(" + (-tx * 22).toFixed(2) + "px," + (-ty * 22).toFixed(2) + "px,0)";
    requestAnimationFrame(loop);
  })();
}

/* preview chrome only — delete when porting */
document.getElementById("replay").addEventListener("click", build);

/* preview chrome only — the pattern-size slider. Once you have settled on a
   size, set CELL to that number above and drop this block along with .sizer. */
var cellIn = document.getElementById("cell"), cellOut = document.getElementById("cellOut");
var sizeT;
cellIn.addEventListener("input", function(){
  CELL = +cellIn.value;
  cellOut.value = CELL + "px";
  clearTimeout(sizeT);
  sizeT = setTimeout(build, 90);        /* debounced — a rebuild is ~500 paths */
});

/* preview chrome only — the pattern-colour pills. In production just set
   data-pattern="blue" | "gold" | "green" on <html> and drop this block. */
var swatches = document.querySelectorAll(".sw");
swatches.forEach(function(b){
  b.addEventListener("click", function(){
    document.documentElement.setAttribute("data-pattern", b.dataset.c);
    swatches.forEach(function(o){ o.setAttribute("aria-pressed", String(o === b)); });
    build();                       /* replay the draw in the new colour */
  });
});
</script>
</body>
